<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-title" content="Checkmark Fitness" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Checkmark Fitness</title>
    <script>
      (function () {
        var p = location.pathname
        var u = p.indexOf('/u/')
        var standalone =
          window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone

        function appBase() {
          if (u > 0) return p.slice(0, u)
          return p.endsWith('/') && p.length > 1 ? p.slice(0, -1) : p === '/' ? '' : p
        }

        if (u < 0) {
          if (standalone) {
            var saved = sessionStorage.getItem('checkmark-pwa-profile')
            if (saved && /^[a-z0-9]([a-z0-9_-]*[a-z0-9])?$/.test(saved)) {
              var base = appBase()
              location.replace((base ? base : '') + '/u/' + saved)
              return
            }
          }
          return
        }

        var base = u === 0 ? '' : p.slice(0, u)
        var h = base ? base + '/' : '/'
        var b = document.createElement('base')
        b.href = h
        document.head.insertBefore(b, document.head.firstChild)

        var slug = p.slice(u).match(/^\/u\/([a-z0-9][a-z0-9_-]*[a-z0-9]|[a-z0-9])/)
        if (!slug) return
        var user = slug[1]
        var manifest = document.querySelector('link[rel="manifest"]')
        if (manifest) manifest.setAttribute('href', base + '/manifest/u/' + user + '.webmanifest')
        var apple = document.querySelector('meta[name="apple-mobile-web-app-title"]')
        if (apple) apple.content = user.charAt(0).toUpperCase() + user.slice(1)
        if (standalone) sessionStorage.setItem('checkmark-pwa-profile', user)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
