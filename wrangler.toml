name = "mxn-checkmark-fitness"
main = "worker/index.ts"
compatibility_date = "2025-12-01"

# Create DB: wrangler d1 create checkmark-fitness
# Then paste database_id below.
[[d1_databases]]
binding = "DB"
database_name = "checkmark-fitness"
# Replace with output of: wrangler d1 create checkmark-fitness
database_id = "cdd2d369-c17f-48a3-8082-111956880730"
migrations_dir = "migrations"
# remote = true: local `npm run dev` and production share the same live D1 (requires internet + `wrangler login`).
remote = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
PUBLIC_APP_ORIGIN = "https://makexnow.com"
PUBLIC_APP_BASE = "/checkmark-fitness"

[dev]
port = 8787
# Local: copy .dev.vars.example → .dev.vars. Production: `npx wrangler secret put OPENAI_API_KEY` (encrypted; not in git).

[observability]
enabled = false
