name = "mxn-checkmark-fitness"
main = "worker/index.ts"
compatibility_date = "2025-12-01"

# Create DB: wrangler d1 create checkmark-fitness
# Then paste database_id below.
[[d1_databases]]
binding = "DB"
database_name = "checkmark-fitness"
# Replace with output of: wrangler d1 create checkmark-fitness
database_id = "cdd2d369-c17f-48a3-8082-111956880730"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[dev]
port = 8787
# Copy .dev.vars.example → .dev.vars and set OPENAI_API_KEY (Wrangler loads it for local dev only).

[observability]
enabled = false
